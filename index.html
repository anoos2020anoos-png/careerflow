<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CareerFlow — a browser-based job application tracker. Organize applications, track interviews, and understand your job search. All data stays in your browser."
    />
    <meta name="theme-color" content="#4F46E5" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CareerFlow — Job Application Tracker</title>
    <script>
      // Apply the stored language before first paint, so an Arabic visitor
      // never sees the layout render left-to-right and then flip.
      (function () {
        try {
          var stored = localStorage.getItem('careerflow:locale');
          var locale =
            stored === 'ar' || stored === 'en'
              ? stored
              : (navigator.language || 'en').toLowerCase().indexOf('ar') === 0
                ? 'ar'
                : 'en';
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {
          /* storage unavailable — the provider sets this again on mount */
        }
      })();
    </script>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the
      // wrong colour scheme. Kept intentionally tiny and dependency-free.
      (function () {
        try {
          var stored = localStorage.getItem('careerflow:theme');
          var mode = stored === '"light"' || stored === '"dark"' || stored === '"system"'
            ? JSON.parse(stored)
            : stored;
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* storage unavailable — fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>CareerFlow requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

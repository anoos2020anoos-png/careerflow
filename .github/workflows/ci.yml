name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type check, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Keyed on package-lock.json, which is committed.
          cache: npm

      - name: Install dependencies
        # `npm ci` needs a lockfile. The fallback keeps the very first push
        # green; commit package-lock.json and every later run is reproducible.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json found — falling back to 'npm install'. Commit the lockfile for reproducible builds."
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

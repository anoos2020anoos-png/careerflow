name: Keep the hosted API awake

# The hosted CareerFlow API runs on Render's free plan, which puts it to sleep
# after 15 minutes without requests; the next sign-in then waits up to a
# minute while it wakes. A request every ten minutes keeps it up. The free
# plan's 750 hours a month cover one server running all month. This lives in
# the app's repository because Actions minutes are free for public ones.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the API for its health
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://careerflow-api-yjwq.onrender.com/health

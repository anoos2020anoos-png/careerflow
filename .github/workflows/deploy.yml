name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for the deploy-pages action to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run the test suite
        # The CI workflow runs the same suite, but in parallel and with nothing
        # waiting on it, so without this a failing push would still go live.
        # The site is only published from a build whose tests pass.
        run: npm test

      - name: Build
        # A project page is served from https://<user>.github.io/<repo>/, so the
        # bundle needs that prefix. Taking it from the repository name means the
        # workflow keeps working if the repository is renamed or forked.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure GitHub Pages
        # Pages must already be switched on for the repository, with
        # Settings -> Pages -> Source set to "GitHub Actions". The default
        # GITHUB_TOKEN cannot create the Pages site itself, so this step reads
        # the existing configuration rather than trying to enable it.
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
